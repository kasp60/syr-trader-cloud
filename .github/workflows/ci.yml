name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check src/index.js
      - name: Run reserve risk unit tests
        run: npm test
      - name: Check browser script syntax
        run: >-
          node -e 'const fs = require("node:fs"); const vm = require("node:vm"); const html = fs.readFileSync("public/index.html", "utf8"); const start = html.indexOf("<script>"); const end = html.indexOf("</script>", start); if (start < 0 || end < 0) throw new Error("Inline script not found"); new vm.Script(html.slice(start + 8, end));'
