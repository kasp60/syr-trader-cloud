name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check src/index.js
      - name: Check browser script syntax
        run: >-
          node -e 'const fs = require("node:fs"); const vm = require("node:vm"); const html = fs.readFileSync("public/index.html", "utf8"); const scripts = [...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(match => match[1]).filter(code => code.trim()); if (!scripts.length) throw new Error("No inline scripts found"); for (const code of scripts) new vm.Script(code);'
